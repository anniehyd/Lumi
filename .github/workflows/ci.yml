name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:run
      # No secrets: the build runs in demo mode and the tests block the network.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
