app = "lumi-live"
primary_region = "ewr"

# Web-only: one machine that stops when idle. Sweeps are triggered from outside
# by POST /api/cron/sweep (.github/workflows/sweep.yml), which wakes the
# machine, runs the whole ingest inline, and lets it stop again. There is no
# worker process and no Redis — see docs/COST.md for why.
#
# To run sweeps from an always-on timer instead, add a second process:
#   [processes]
#     web = "npm run start"
#     worker = "npm run worker"      # inline mode: a timer, still no Redis
# and give it its own [[vm]] block (256mb is enough).

[build]

[deploy]
  release_command = "npx prisma db push --skip-generate"

[env]
  NODE_ENV = "production"
  NEXTAUTH_URL = "https://lumi-live.fly.dev"
  LUMI_USE_MOCK_FALLBACK = "false"
  INGEST_MODE = "inline"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
