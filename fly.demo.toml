app = "lumi-demo"
primary_region = "ewr"

# Public demo: no Google OAuth and no database, so every route serves the
# seeded mock inbox (src/lib/dataSource.ts) and decisions live in process
# memory until the machine stops. Nothing here is real mail. The live app is
# fly.live.toml.

[build]

[env]
  NODE_ENV = "production"
  NEXTAUTH_URL = "https://lumi-demo.fly.dev"
  LUMI_USE_MOCK_FALLBACK = "true"
  INGEST_MODE = "inline"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
