app = "lumi-demo"
primary_region = "ewr"

# Public demo: no Google OAuth, so there is nobody to sign in as and every
# route serves the one seeded account (LUMI_DEMO_USER_EMAIL, made by
# scripts/seed-demo-user.ts) out of its own database on the lumi-db cluster.
# Mail reaches it through the forwarding webhook, so the cards are what the
# real pipeline made of real newsletters. The live app is fly.live.toml.

[build]

[deploy]
  release_command = "npx prisma db push --skip-generate"

[env]
  NODE_ENV = "production"
  NEXTAUTH_URL = "https://lumi-demo.fly.dev"
  LUMI_USE_MOCK_FALLBACK = "false"
  INGEST_MODE = "inline"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
